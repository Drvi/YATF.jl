name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: julia ${{ matrix.version }} - ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    # A stuck worker is the failure mode this package has to survive, so a job
    # that hangs is bounded here rather than left to burn the six-hour default.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 1.12 is the lowest version [compat] claims; '1' is the current stable.
        version: ['1.12', '1']
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          # The hosted macOS runners are Apple silicon.
          - os: macos-latest
            arch: aarch64
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # Nothing consumes a coverage report, and the instrumentation slows
          # down a suite whose test items assert on timeouts as short as 2s.
          coverage: false
          # Bounds checks as the code declares them. The action's default is
          # `yes`, which forces them on everywhere regardless of `@inbounds`.
          check_bounds: auto
        env:
          # The runners have 3-4 vCPUs and each test file starts worker processes
          # of its own; the suite's own default of 4 files in flight oversubscribes
          # them, which shows up as timeout assertions failing.
          YATF_TEST_JOBS: 2
          # Every test-file child is started with the thread count of the process
          # that starts it, so this is what each of the two in flight gets.
          JULIA_NUM_THREADS: 2
